name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  world-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-palette.mjs --strict
