name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  world-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-client
    steps:
      # red-first 要拿 base 提交建临时 worktree；默认浅克隆只有 1 个提交，取不到 base。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # `npm test` 里有真实服务联调用例（creation-ledger-server.integration）：
      # 自己在测试里起 `python -m uvicorn`，缺 uvicorn 会「服务进程提前退出」红。
      - run: pip install -r ../server/requirements.txt
      - run: npm run check
      # 端口纪律 lint：脚本/配置/.env 里的禁用端口（5188/5191/5202/5203）命中即红。
      - run: npm run audit:ports
      - run: npm test
      # 语义层：回放夹具（6 条 / 195 项断言）。只读文件与内存回放，不需要 preview。
      - run: npm run fixture:check
      # 先红后绿：只把本次 `world-client/test/` 的 diff 套到 base 上再跑，必须红。
      # base 取自事件 sha（PR 用 base.sha，push main 用 before），避免浅克隆/local ref 失真。
      - name: red-first 红灯闸门
        run: npm run red:first -- --base "${{ github.event.pull_request.base.sha || github.event.before }}"
        env:
          RED_FIRST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build
      - run: node scripts/audit-palette.mjs --strict
      # 行号引用对不上就红。文档与注释里写的「代码在那儿」得真的是在那儿——
      # 这个仓库的信条是「说谎比不去更糟」，那句话也管仓库自己。
      - run: node scripts/audit-references.ts --strict
      # 不带行号的引用也管：`night.ts`、`docs/LARGE_WORLD.md` 这类只写文件名的，
      # 上面那个正则（冒号加行号是硬条件）一处都看不见。六个幽灵引用全是这么漏进来的。
      - run: node scripts/audit-citations.ts --strict
      # 节号对不上也管：`SPEC_V2 §9`、`docs/adr/ADR_SAVE.md §9` 这种点名了文档、
      # 而那份文档里没有这一节的。`villager.ts` 的「审计 §6.2」与 `day-phase.ts` 的
      # 「§6 缺口 2」都是这一类，两处都靠人 review 才发现，没有任何机关会红。
      - run: node scripts/audit-sections.ts --strict
      # 标注式断言：文档里的数字/版本用 <!-- claim: name=value --> 标出，
      # 这里按固定探针复算；同时校验 10 份 ADR 的 status/evidence。
      - run: node scripts/audit-claims.ts --strict
      # 指标账本的口径（25 条 metric）必须能复算；不接 verify-all 聚合器，
      # 两条独立 step 各自可判红：eval-ledger 先算，selfcheck 再验分桶与必填字段。
      - run: node scripts/eval-ledger.ts
      - run: node scripts/verify-ledger-selfcheck.ts
      # screens-diff 自检只喂合成图（200x200），不读 eval/screens 的截图基线，
      # 所以 E7 删掉的 3 张基线不影响它。锁定版本是因为仓库没有 requirements.txt，
      # 浮动版本会让截图比对结果漂移；本地实测通过的是下面这两个版本。
      - run: pip install numpy==2.5.1 pillow==12.3.0
      - run: python scripts/verify-screens-diff-selfcheck.py


  # 浏览器闸门：不需要模型/服务端，但需要一个 preview server 与 chromium。
  # 三道都只读；EVAL_OUT 指到 runner 临时目录，保证仓库 eval/ 不被写脏。
  world-client-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # preview 必须与三道检查在同一个 step：runner 在 step 结束时清理后台进程，
      # 拆成两步会让第二条命令拿到 ERR_CONNECTION_REFUSED。
      # runner 上下文在 job 级 env 不可用，只能放在 step 级，否则工作流整体不编译。
      - run: |
          npm run preview -- --port 5211 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5211/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5211/ > /dev/null
          npm run test:persistence
          npm run test:render-budget
          npm run test:phases
          node scripts/check-shot-actor-pin.mjs
          node scripts/check-phases-negative.mjs
        env:
          EVAL_OUT: ${{ runner.temp }}/eval-screens
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status
            exit 1
          fi

  # 仓库级手续：钩子自检与 worktree 登记巡检。只用 node 内置模块，不需要 npm ci。
  repo-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 新 clone / 新机器不会继承 core.hooksPath，钩子会安静地失效。这一步故意先跑一次：
      # 未安装时把 `hooks: FAIL core.hooksPath=(unset)` 原样打进日志，不让它无声无息。
      - name: 钩子自检（安装前读数）
        run: npm run check:hooks || echo "::notice title=check:hooks::新 clone 未继承 core.hooksPath（预期）；下一步安装后必须 OK"
      # 安装后必须 OK，否则 pre-push 的 main 保护形同不存在，这里直接红。
      - name: 安装钩子并复核
        run: |
          git config core.hooksPath .githooks
          npm run check:hooks
      # 非 --strict：CI 里 main worktree 的绝对路径与登记表不同，严格模式会误红。
      - name: worktree 登记巡检
        run: npm run worktrees:audit
      # 孤儿闸门：检查脚本 / 检查型 npm 脚本必须有 workflow 或 import 消费方；
      # 允许清单里的例外必须存在、带理由，且一接闸就要从清单删掉，否则这里红。
      - name: 孤儿闸门检测
        run: npm run audit:orphan-gates
      # 回归：continue-on-error: true / `|| true` / if: false 的接线不算消费方（5 条用例）。
      - name: 孤儿闸门检测自检
        run: node --test scripts/orphan-gates-selftest.mjs

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest
