[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-world-server"
version = "0.1.0"
description = "像素世界引擎的服务端：事件日志、规则校验、造物主"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # 调模型用。OpenAI 兼容的 chat/completions，StepFun / DeepSeek / 自建网关同形。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["events", "oracle", "rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
